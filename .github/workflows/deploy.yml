name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 👈 deploy whenever you push to main
  repository_dispatch:
    types:
      - resume-updated  # 👈 fired by the Resume- repo when the resume changes
  schedule:
    - cron: "0 8 * * *" # daily safety rebuild so the resume is never stale
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Vite supports Node 22

      - name: Install dependencies
        run: npm install

      - name: Sync latest resume from Resume- repo
        run: |
          tmp=$(mktemp)
          if curl -sfL \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               https://api.github.com/repos/Amuo007/Resume-/contents/resume.pdf \
               -o "$tmp" \
             && head -c 4 "$tmp" | grep -q "%PDF"; then
            mv "$tmp" public/resume.pdf
            echo "Resume synced from Resume- repo ($(wc -c < public/resume.pdf) bytes)"
          else
            echo "::warning::Could not fetch the latest resume; deploying with the copy committed in this repo."
          fi

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist