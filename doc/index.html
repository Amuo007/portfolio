<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234338ca'/%3E%3Ctext x='50' y='66' font-size='44' font-family='Menlo, monospace' font-weight='bold' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Docs</title>

    <!-- Unlisted page: not linked from the portfolio and kept out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Course code notes." />

    <script>
      // Set the theme before the page paints so there is no white flash in dark mode.
      (function () {
        var t = null;
        try { t = localStorage.getItem("doc-theme"); } catch (e) {}
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html, body { margin: 0; background: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0d0f13; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/doc/main.jsx"></script>
  </body>
</html>
