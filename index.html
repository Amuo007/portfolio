    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      ::selection {
        background: #dbeafe;
        color: #0f172a;
      }

      .no-scrollbar {
        scrollbar-width: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Keep anchored sections from hiding under the sticky header */
      section[id] {
        scroll-margin-top: 5.5rem;
      }

      /* ---- Motion ---- */
      :root {
        --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Scroll-triggered reveal */
      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition:
          opacity 0.7s var(--ease-out-soft),
          transform 0.7s var(--ease-out-soft);
        transition-delay: var(--reveal-delay, 0ms);
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* One-time entrance for the hero */
      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* "backwards" (not "both") so the finished animation releases the
         transform back to author styles — keeps the hover scale working. */
      .hero-rise {
        animation: rise-in 0.8s var(--ease-out-soft) backwards;
        animation-delay: var(--rise-delay, 0ms);
      }

      /* Gentle lift on hover for cards */
      .card-lift {
        transition:
          transform 0.4s var(--ease-out-soft),
          box-shadow 0.4s var(--ease-out-soft);
      }

      @media (hover: hover) {
        .card-lift:hover {
          transform: translateY(-3px);
          box-shadow: 0 14px 30px -14px rgba(17, 24, 39, 0.14);
        }
      }

      /* Subtle press feedback on buttons and links */
      .press {
        transition:
          transform 0.2s var(--ease-out-soft),
          background-color 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .press:active {
        transform: scale(0.97);
      }

      /* Nav link underline that grows from the center */
      .nav-link {
        position: relative;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        left: 0.625rem;
        right: 0.625rem;
        bottom: 0.25rem;
        height: 2px;
        border-radius: 9999px;
        background: #2563eb;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 0.35s var(--ease-out-soft);
      }

      /* Hover-gated so tapped links don't keep a stale underline on touch */
      @media (hover: hover) {
        .nav-link:hover::after {
          transform: scaleX(1);
        }
      }

      .nav-link:focus-visible::after {
        transform: scaleX(1);
      }

      /* Active nav link keeps its underline */
      .nav-link-active::after {
        transform: scaleX(1);
      }

      /* Thin scroll progress line at the bottom edge of the header */
      .scroll-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: #2563eb;
        transform: scaleX(0);
        transform-origin: left center;
        pointer-events: none;
      }

      /* Staggered child items inside reveal containers */
      .reveal .stagger-item {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.5s var(--ease-out-soft),
          transform 0.5s var(--ease-out-soft);
        transition-delay: var(--stagger-delay, 0ms);
      }

      .reveal.is-visible .stagger-item {
        opacity: 1;
        transform: translateY(0);
      }

      /* Section heading accent line grows in on reveal */
      .heading-accent::after {
        content: "";
        display: block;
        width: 2.75rem;
        height: 3px;
        margin-top: 0.625rem;
        border-radius: 9999px;
        background: #2563eb;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.7s var(--ease-out-soft) 0.2s;
      }

      .reveal.is-visible .heading-accent::after {
        transform: scaleX(1);
      }

      /* Smooth README expand */
      @keyframes panel-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel-in {
        animation: panel-in 0.45s var(--ease-out-soft) both;
      }

      /* Gentle breathing dot for "In Progress" status */
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.75);
        }
      }

      .pulse-dot {
        animation: pulse-dot 2s ease-in-out infinite;
      }

      /* Language bar sweeps in from the left when revealed */
      .reveal .lang-track {
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.9s var(--ease-out-soft) 0.15s;
      }

      .reveal.is-visible .lang-track {
        transform: scaleX(1);
      }

      /* Floating back-to-top button */
      .back-to-top {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 40;
        width: 2.75rem;
        height: 2.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid #e5e7eb;
        box-shadow: 0 8px 24px -12px rgba(17, 24, 39, 0.25);
        color: #374151;
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition:
          opacity 0.4s var(--ease-out-soft),
          transform 0.4s var(--ease-out-soft),
          color 0.2s ease;
      }

      .back-to-top:hover {
        color: #2563eb;
      }

      .back-to-top:active {
        transform: scale(0.94);
      }

      .back-to-top.is-shown {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      /* Contribution cells pop in one by one, sweeping across the graph */
      @keyframes cell-pop {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }
        60% {
          opacity: 1;
          transform: scale(1.2);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .contrib-wait .contrib-cell {
        opacity: 0;
      }

      .contrib-play .contrib-cell {
        animation: cell-pop 0.45s var(--ease-out-soft) both;
        animation-delay: var(--cell-delay, 0ms);
      }

      /* Soft fade for async content (repos, contribution graph) */
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .fade-in {
        animation: fade-in 0.6s ease both;
      }

      /* Print everything, even sections not yet revealed on screen */
      @media print {
        .reveal,
        .hero-rise,
        .panel-in,
        .fade-in,
        .reveal .stagger-item,
        .contrib-wait .contrib-cell,
        .contrib-play .contrib-cell {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
          animation: none !important;
        }

        .heading-accent::after,
        .reveal .lang-track {
          transform: none !important;
          transition: none !important;
        }

        .back-to-top {
          display: none !important;
        }

        .pulse-dot {
          animation: none !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .reveal,
        .hero-rise,
        .panel-in,
        .fade-in,
        .reveal .stagger-item,
        .contrib-wait .contrib-cell,
        .contrib-play .contrib-cell {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
          animation: none !important;
        }

        .heading-accent::after,
        .reveal .lang-track {
          transform: none !important;
          transition: none !important;
        }

        .back-to-top {
          transform: none !important;
        }

        .pulse-dot {
          animation: none !important;
        }

        .card-lift,
        .press,
        .nav-link::after,
        .back-to-top {
          transition: none !important;
        }
      }
    </style>
